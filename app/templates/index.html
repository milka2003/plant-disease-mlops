
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plant Disease Detection AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.container{
    width:90%;
    max-width:650px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
    font-size:55px;
    margin-bottom:10px;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:30px;
}

.upload-box{
    border:2px dashed #4ade80;
    border-radius:15px;
    padding:30px;
    margin-bottom:20px;
    cursor:pointer;
}

.upload-box:hover{
    background:rgba(255,255,255,0.05);
}

input[type=file]{
    width:100%;
    color:white;
}

button{
    margin-top:20px;
    background:#22c55e;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#16a34a;
}

.preview{
    margin-top:20px;
}

.preview img{
    max-width:250px;
    border-radius:12px;
    display:none;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    display:none;
}

.result h2{
    margin-bottom:10px;
}

.confidence{
    color:#4ade80;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🌿</div>

    <h1>Plant Disease Detection AI</h1>

    <p class="subtitle">
        Upload a plant leaf image and get instant disease prediction using AI.
    </p>

    <form id="uploadForm">

        <div class="upload-box">
            <input type="file" id="image" accept="image/*" required>
        </div>

        <button type="submit">
            Analyze Image
        </button>

    </form>

    <div class="preview">
        <img id="previewImage">
    </div>

    <div class="result" id="resultBox">
        <h2 id="disease"></h2>
        <p class="confidence" id="confidence"></p>
    </div>

</div>

<script>

const imageInput = document.getElementById("image");
const previewImage = document.getElementById("previewImage");

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        previewImage.src = URL.createObjectURL(file);
        previewImage.style.display = "block";
    }
});

document.getElementById("uploadForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const file = imageInput.files[0];

    const formData = new FormData();

    formData.append("image", file);

    const response = await fetch("/predict",{
        method:"POST",
        body:formData
    });

    const data = await response.json();

    document.getElementById("resultBox").style.display="block";

    if(data.error){

        document.getElementById("disease").innerHTML =
            "Error: " + data.error;

        document.getElementById("confidence").innerHTML = "";

    }else{

        document.getElementById("disease").innerHTML =
            "Disease: " + data.prediction;

        document.getElementById("confidence").innerHTML =
            "Confidence: " + data.confidence + "%";
    }

});

</script>

</body>
</html>
