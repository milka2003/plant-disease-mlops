apiVersion: apps/v1
kind: Deployment

metadata:
  name: plant-disease-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: plant-disease-api

  template:
    metadata:
      labels:
        app: plant-disease-api

    spec:
      containers:
      - name: plant-disease-api
        image: plant-disease-api:latest

        ports:
        - containerPort: 5000